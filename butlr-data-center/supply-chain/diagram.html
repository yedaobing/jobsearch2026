<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butlr Supply Chain Handoff Workflow · Full screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f2f5f6; --surface:#ffffff; --ink:#142228; --muted:#57666d; --line:#d3dce0;
  --accent:#0b6c76; --accent-soft:#dbeef0;
  --jd:#3e4aa8; --jd-soft:#e4e7f8;
  --ehs:#9a5b00; --ehs-soft:#fbeed6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1518; --surface:#152025; --ink:#e2eaed; --muted:#94a4ab; --line:#2a3a40;
  --accent:#55c3cb; --accent-soft:#12343a; --jd:#a3adf2; --jd-soft:#232948;
  --ehs:#eaaa45; --ehs-soft:#3a2b10; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1518; --surface:#152025; --ink:#e2eaed; --muted:#94a4ab; --line:#2a3a40;
  --accent:#55c3cb; --accent-soft:#12343a; --jd:#a3adf2; --jd-soft:#232948;
  --ehs:#eaaa45; --ehs-soft:#3a2b10; color-scheme:dark }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:14px 24px 10px}
h1{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:clamp(20px,2.4vw,30px);margin:0;letter-spacing:-.01em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;padding:1px 6px;border-radius:3px;vertical-align:1px;margin-right:4px}
.tag.dn{background:var(--accent-soft);color:var(--accent)} .tag.up{background:var(--ehs-soft);color:var(--ehs)} .tag.bo{background:var(--jd-soft);color:var(--jd)}
nav{margin-left:auto;display:flex;gap:6px}
nav button{font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
nav a{font-size:13px;color:var(--muted);align-self:center;margin-left:6px}
main{min-height:0;padding:4px 24px 16px;display:grid}
.slide{min-height:0;display:grid;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.slide svg{width:100%;height:100%;display:block}
.slide text{font-family:var(--f-body)}
.only-overview,.only-handoff{display:contents}
</style>
</head>
<body>
<div class="bar">
  <h1 id="ttl">Supply Chain and TPM handoffs, stage by stage</h1>
  <div class="legend" id="lg">
    <span><span class="tag dn">TPM → SC</span>TPM sends</span>
    <span><span class="tag up">SC → TPM</span>Supply Chain sends</span>
    <span><span class="tag bo">BOTH</span>Two-way</span>
    <span>Dashed: expansion loops back to order and build</span>
  </div>
  <nav>
    <button type="button" data-v="handoff" aria-pressed="true">Handoffs</button>
    <button type="button" data-v="overview" aria-pressed="false">Stages</button>
    <a href="./">Full page</a>
  </nav>

<script>
const views={handoff:["Supply Chain and TPM handoffs, stage by stage",true],overview:["Butlr data center supply chain: eight stages",false]};
function show(v){
  for(const k in views) document.getElementById(k).hidden = k!==v;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v));
  document.getElementById('ttl').textContent=views[v][0];
  document.getElementById('lg').style.visibility=views[v][1]?'visible':'hidden';
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='2') show('overview');
  if(e.key==='ArrowLeft'||e.key==='1') show('handoff');
  if(e.key==='f') document.documentElement.requestFullscreen?.();
});
if(location.hash==='#stages') show('overview');
</script>
